name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env Configuration
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APKs (Split per ABI + Universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Buddy Tracker ${{ github.ref_name }}"
          body: |
            ### 🕷️ Buddy Tracker ${{ github.ref_name }}
            
            **Local-first campus buddy location sharing with Spider-Sense radar.**
            
            #### 📦 Download Assets:
            - **`app-arm64-v8a-release.apk`** — Recommended for most modern Android phones (Android 8+).
            - **`app-armeabi-v7a-release.apk`** — For older 32-bit Android devices.
            - **`app-release.apk`** — Universal APK containing all architectures.
            
            #### 🛡️ Privacy & Architecture Features:
            - **₹0 Infrastructure**: Drift SQLite local-first persistence + Supabase cloud database & realtime.
            - **Spider-Sense Radar**: 500m concentric tactical radar with real-time GPS bearing.
            - **Continuous Online Tracking**: Realtime mutual location updates with Android foreground service notification.
            - **Offline Resilience**: Automatic last-known location caching with freshness indicators.
            - **Instant Mutual Pairing**: Pair seamlessly via QR scan or 6-character Unique ID.
            - **Full User Control**: Global "Stop Sharing My Location" switch in Settings & persistent Dashboard banner.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
